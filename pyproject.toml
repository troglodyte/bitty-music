[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bitty-music"
version = "0.1.0"
description = "Classical scores to chiptune audio"
requires-python = ">=3.11"
dependencies = [
    "music21>=9.1",
    "numpy>=1.26",
    "scipy>=1.11",
    "soundfile>=0.12",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
bitty = "bitty.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/bitty"]

[tool.pytest.ini_options]
testpaths = ["tests"]

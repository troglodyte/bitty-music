# Close to the hardware: three channels, no echo, a mono image, shallow late
# vibrato, and envelopes that decay rather than sit. Two pulses and a triangle
# is the NES melodic roster; its remaining channels are noise and DPCM, which
# this roster has no voice for.

[voices]
count = 3

[echo]
on = false

[vibrato]
depth_cents = 12.0
delay_ms = 420

[voices.lead]
volume_env = [15, 14, 12, 10, 9, 8, 8]
pan = 0.0

[voices.counter]
duty = 0.125
volume_env = [12, 11, 9, 8, 7, 7]
pan = 0.0

[voices.bass]
volume_env = [15, 13, 11, 10]
pan = 0.0

# inner_a and inner_b are moot at count = 3 — truncation is a view, not a
# deletion, so these stay addressable in case a later config layer raises
# the count back up. Deleting them here means an inner voice that comes
# back reappears un-styled: default envelope, default pan, half-mono image
# from a preset whose whole point is mono. Keep them styled even though
# they are silent at this preset's own count.
[voices.inner_a]
volume_env = [11, 9, 8, 7, 7]
pan = 0.0

[voices.inner_b]
volume_env = [11, 9, 8, 7, 7]
pan = 0.0

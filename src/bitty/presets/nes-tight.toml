# Close to the hardware: no echo, a mono image, shallow late vibrato, and
# envelopes that decay rather than sit. Three voices — the NES's true
# two-pulses-and-a-triangle melodic roster.
#
# count = 3 was held back until 2026-08-23. At three voices there is only one
# middle voice, so `_pick_middle` places at most one note per onset and
# everything else overflows; before the reduction policy that overflow became
# a near-continuous arpeggio covering 92% of the chorale, 54% of the minuet
# and 43% of ragtime, which auditioned as "better, still not musical". The
# reduction policy now judges overflow before folding it, and the arpeggio's
# share falls to 0.0% on both the chorale and the minuet and 26.1% on
# ragtime. Auditioned at these settings and accepted.
#
# What that costs: the policy drops notes rather than arpeggiating them, so a
# few chords lose a third they used to have — 7 of the chorale's 34 reduction
# decisions at this count. That is the trade this preset accepts to sound
# like the hardware.

[voices]
count = 3

[echo]
on = false

[vibrato]
depth_cents = 12.0
delay_ms = 420

[voices.lead]
volume_env = [15, 14, 12, 10, 9, 8, 8]
pan = 0.0

# counter carries the arp overflow at count = 3 (`.arp` is the narrowest
# surviving middle, and at three voices that is counter itself). Its duty of
# 0.125 is therefore what ragtime's 26% of arpeggio actually sounds like —
# load-bearing, not just colour on a supporting part.
[voices.counter]
duty = 0.125
volume_env = [12, 11, 9, 8, 7, 7]
pan = 0.0

[voices.bass]
volume_env = [15, 13, 11, 10]
pan = 0.0

# Both inner voices are silent at this preset's own count. They stay styled
# because truncation is a view, not a deletion: a later config layer can raise
# the count back to 4 or 5, and an inner voice that comes back un-styled
# reappears with a default envelope, default pan, and a half-mono image from a
# preset whose whole point is mono. At count = 4, inner_a is also where the
# arp overflow moves.
[voices.inner_a]
volume_env = [11, 9, 8, 7, 7]
pan = 0.0

[voices.inner_b]
volume_env = [11, 9, 8, 7, 7]
pan = 0.0

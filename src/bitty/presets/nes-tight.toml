# Close to the hardware: no echo, a mono image, shallow late vibrato, and
# envelopes that decay rather than sit. Four channels, not the NES's true
# two-pulses-and-a-triangle melodic roster — three pulses sound at once here,
# which no NES can do — but closer than the five-voice default.
#
# count = 3 would be the honest roster, but is not shippable yet: at three
# voices there is only one middle voice, so `_pick_middle` can place at most
# one note per onset and everything else overflows into `_arpeggiate`. The
# arpeggio itself is fine now — Phase 7 put it in tune — so what is left is
# a question of proportion. Re-auditioned 2026-08-23: the chorale spends 92%
# of its length with its entire middle voice on a two-note arpeggio, the
# minuet 54%, ragtime 43%; at count = 4 the first two do not arpeggiate at
# all. The verdict was "better, still not musical" — a correct effect
# covering far too much of the piece. Making count = 3 musical is arranger
# work (spreading overflow more gently, or a second arp carrier) that is its
# own later phase; until then this preset uses count = 4.

[voices]
count = 4

[echo]
on = false

[vibrato]
depth_cents = 12.0
delay_ms = 420

[voices.lead]
volume_env = [15, 14, 12, 10, 9, 8, 8]
pan = 0.0

[voices.counter]
duty = 0.125
volume_env = [12, 11, 9, 8, 7, 7]
pan = 0.0

[voices.bass]
volume_env = [15, 13, 11, 10]
pan = 0.0

# inner_a is active at count = 4 and carries the arp overflow (`.arp` is the
# narrowest surviving middle) — its styling here is load-bearing, not moot.
# inner_b stays styled even though it is silent at this preset's own count:
# truncation is a view, not a deletion, so it stays addressable in case a
# later config layer raises the count back to 5. Deleting it here means an
# inner voice that comes back reappears un-styled: default envelope, default
# pan, half-mono image from a preset whose whole point is mono.
[voices.inner_a]
volume_env = [11, 9, 8, 7, 7]
pan = 0.0

[voices.inner_b]
volume_env = [11, 9, 8, 7, 7]
pan = 0.0
